apply plugin: 'com.android.application'

// Play signing credentials live in an untracked keystore.properties beside
// this file (see PLAY_STORE.md). Absent — on a fresh clone, or for anyone
// who only builds debug — the release build simply stays unsigned instead of
// failing, so nothing here depends on secrets being present.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.flashcardcatalog.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.flashcardcatalog.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode it has already seen, so
        // this must be incremented for every single upload, even a re-upload
        // of the same version after a rejection.
        // versionName must stay in step with APP_VERSION in src/whatsNew.js —
        // that is what decides whether a user is shown the update note.
        versionCode 8
        versionName "1.2.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            ndk {
                // Debug builds are the single APK handed out directly from the
                // GitHub release, so they carry one CPU type's copy of the
                // ~10MB ML Kit OCR library instead of all four. Release builds
                // deliberately keep every ABI: Play splits an app bundle per
                // device, so full coverage there costs users no download size
                // and keeps x86_64 hardware (Chromebooks, some tablets)
                // able to install.
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            // R8 is left off deliberately: Capacitor bridges JavaScript to
            // native plugins by reflection, so shrinking risks stripping
            // classes that are only ever referenced by name at runtime.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Play requires an app bundle for new apps; these splits are what let it
    // ship each device only the code and resources it actually needs.
    bundle {
        abi { enableSplit = true }
        density { enableSplit = true }
        language { enableSplit = true }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Capacitor depends on webkit as `implementation`, so it reaches the app at
    // runtime but not at compile time. MainActivity needs to name it.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
